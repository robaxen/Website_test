<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frata hemsida</title>

    <style>
        body{
            background-color:rgb(178, 243, 243);
        }

        header{
            text-align: center;
        }
        
        img{
            width: 200px;
        }

        button{

            color: white;
            background-color: blue;

            font-size: x-large;
            border: none;

            padding: 10px;
            border-radius: 50px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Domer</h1>    
        <img src="media/domer.jpg"></img>
        <nav>

        </nav>

        <button id="buttonGober" >Gober</button>
    </header>

    <div class="main">

        <div id="goberCage"></div>
    </div>

    

    

   
    
    <script>
        const goberCage = document.getElementById("goberCage")

        const buttonGober = document.getElementById("buttonGober")
        buttonGober.addEventListener("click", gober)

        function gober(){
            const newImg = document.createElement("img");
            newImg.src = "media/domer.jpg";

            goberCage.appendChild(newImg);
        }
    </script>

</body>
</html>
